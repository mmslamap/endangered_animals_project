# application.properties (Main configuration)
spring.application.name=Endangered Animals
spring.datasource.url=jdbc:postgresql://localhost:5432/endangered_animals
spring.datasource.username=USER
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.initialization-mode=always
spring.jpa.hibernate.ddl-auto=none
# Server Configuration
server.port=8080
# JWT Configuration (optional - since we're using UUID for secret key)
jwt.expiration=3600000
# Spring Security Configuration
spring.security.filter.order=10
# Database Security
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# Disable Spring Security's default basic authentication
spring.security.basic.enabled=false